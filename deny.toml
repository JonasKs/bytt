# bytt only ships for Apple Silicon macOS.
[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
ignore = [
  # chrono is unmaintained (no vulnerability). bytt only formats and subtracts
  # timestamps with it; replace it when a successor settles.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability" },
]
version = 2
yanked = "warn"

[sources]
unknown-git = "deny"
unknown-registry = "deny"

[licenses]
allow = [
  "Unicode-3.0",
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
version = 2

[licenses.private]
ignore = true
